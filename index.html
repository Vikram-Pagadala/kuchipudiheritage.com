<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuchipudi Heritage Arts Society</title>
  <meta http-equiv="refresh" content="0; url=public/">
  <script>window.location.replace("public/");</script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #24101A;
      color: #FBF6F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      padding: 2.5rem 2rem;
      background: rgba(59, 19, 38, 0.7);
      border: 1px solid rgba(200, 150, 46, 0.4);
      border-radius: 14px;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    h1 { color: #F1D38A; font-size: 1.6rem; margin-top: 0; margin-bottom: 0.5rem; }
    p { color: #E4D0CA; font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #A3162E, #6B0F2B);
      color: #F1D38A;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      border: 1px solid #C8962E;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(200, 150, 46, 0.3);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Kuchipudi Heritage Arts Society</h1>
    <p>Opening the official website and registration portal…</p>
    <a href="public/">Enter Website &rarr;</a>
  </div>
</body>
</html>
